<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GenAI Process Spectrum</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="spectrum-container">
    <h2>GenAI Use Spectrum: From a Little to a Lot</h2>

    <div class="spectrum-controls">
      <label class="toggle-left">
        <input type="checkbox" id="noAiToggle"> I did not use AI for this task
      </label>
      <label class="toggle-right">
        <input type="checkbox" id="fullAiToggle"> I used AI to fully automate this task
      </label>
    </div>

    <!-- Clickable Spectrum Bar -->
    <div class="spectrum-bar" id="spectrumBar">
      <div class="gradient-bar"></div>
      <div id="dot" class="spectrum-dot"></div>
    </div>

    <!-- AI Collaboration Level (now dynamic zone label only) -->
    <div class="spectrum-label" id="zoneLabel"></div>

    <!-- AI Process -->
<div class="ai-process-box">
  <h3>How You Used AI</h3>
  <div id="scenario-output" class="scenario-output"></div>

  <h4 style="margin-top: 20px;">Think It Through</h4>
  <div id="scenario-output" class="scenario-output"></div>
</div>

  <!-- Script -->
  <script src="script.js" defer></script>
</body>
</html>
